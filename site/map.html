<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris Map</title>
<meta name="description" content="Walking and metro routes from our Paris Airbnb at 130 Rue de Turenne, plus cafés and shops nearby">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body class="map-page">
<button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button>

<nav class="pagetabs" aria-label="Pages">
  <div class="wrap">
    <a href="./">Itinerary</a>
    <a href="map.html" aria-current="page">Paris Map</a>
    <a href="gear.html">Gear &amp; Insurance</a>
  </div>
</nav>

<div class="mapapp" id="mapapp">
  <div id="map" aria-label="Map of Paris around our Airbnb"></div>

  <div class="routebar" id="routebar" hidden></div>

  <aside class="mpanel" id="sheet" data-state="peek">
    <div class="sheet-head" id="sheetHead">
      <div class="grabber" aria-hidden="true"></div>
      <button type="button" class="home-row" id="homeRow">
        <span class="home-dot" aria-hidden="true">🏠</span>
        <span><span class="home-title">130 Rue de Turenne</span><span class="home-sub">Our Airbnb · tap to see what's nearby</span></span>
      </button>
      <div class="place-head" id="placeHead" hidden></div>
      <div class="mtabs" role="tablist" aria-label="Map views">
        <button type="button" role="tab" id="tab-sights" aria-selected="true" data-view="sights">🗺️ Sights &amp; routes</button>
        <button type="button" role="tab" id="tab-nearby" aria-selected="false" data-view="nearby">☕ Nearby</button>
      </div>
    </div>

    <div class="sheet-body" id="sheetBody">
      <div id="view-sights" role="tabpanel" aria-labelledby="tab-sights">
        <p class="muted intro">Haut-Marais, 3rd arrondissement. The nearest metro is Filles du Calvaire (line 8), 4 minutes away. Tap a sight for walking time and route.</p>
        <div id="sightList"></div>
      </div>

      <div id="view-nearby" role="tabpanel" aria-labelledby="tab-nearby" hidden>
        <input type="search" id="placeSearch" class="msearch" placeholder="Search cafés, bakeries, shops…" aria-label="Search nearby places">
        <div class="chips" id="chips"></div>
        <p class="count" id="placeCount"></p>
        <ul class="plist" id="placeList"></ul>
      </div>

      <div id="view-place" role="region" aria-label="Place details" hidden></div>

      <p class="mfoot" id="attrib"></p>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const WALK_M_PER_MIN = 80;   // ~4.8 km/h
const STOP_MIN = 1.8, TRANSFER_MIN = 4, WAIT_MIN = 3;
const NEARBY_ZOOM = 17, PLACES_MIN_ZOOM = 16;
const GROUPS = {
  coffee:   { label: "Coffee",      icon: "☕", on: true },
  bakery:   { label: "Bakeries",    icon: "🥐", on: true },
  grocery:  { label: "Groceries",   icon: "🛒", on: true },
  shops:    { label: "Shops",       icon: "🛍️", on: true },
  pharmacy: { label: "Pharmacy",    icon: "💊", on: true },
  money:    { label: "ATM",         icon: "🏧", on: true },
  food:     { label: "Restaurants", icon: "🍽️", on: false },
  bars:     { label: "Bars",        icon: "🍷", on: false },
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const walkMin = m => Math.max(1, Math.round(m / WALK_M_PER_MIN));
const km = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
const gmaps = (lat, lon, mode, home) =>
  `https://www.google.com/maps/dir/?api=1&origin=${home.lat},${home.lon}&destination=${lat},${lon}&travelmode=${mode}`;
const lineBadge = (line, color) => `<span class="mline" style="--c:${color}">${esc(line)}</span>`;
const isMobile = () => !matchMedia("(min-width: 900px)").matches;

function metroMinutes(m) {
  const rideMin = m.rides.reduce((s, r) => s + (r.stops.length - 1) * STOP_MIN, 0);
  return Math.round(walkMin(m.walkTo.m) + WAIT_MIN + rideMin + (m.rides.length - 1) * TRANSFER_MIN + walkMin(m.walkFrom.m));
}

let D, map, routeLayer, sightLayer, placeLayers = {}, homeMarker;
let selected = null, mode = null, view = "sights", placeSel = null;

const navH = () => document.documentElement.style.setProperty("--nav-h", document.querySelector(".pagetabs").offsetHeight + "px");
navH(); window.addEventListener("resize", navH);

/* ---------- Bottom sheet (phones) ---------- */
const sheet = document.getElementById("sheet");
const sheetHead = document.getElementById("sheetHead");
const app = document.getElementById("mapapp");

function sheetOffsets() {
  const h = sheet.offsetHeight;
  return { peek: h - sheetHead.offsetHeight, half: Math.max(0, h - Math.round(app.offsetHeight * 0.52)), full: 0 };
}
// How much of the map the sheet covers at the bottom, in px.
function sheetCover() {
  if (!isMobile()) return 0;
  return sheet.offsetHeight - sheetOffsets()[sheet.dataset.state];
}
function setSheet(state) {
  sheet.dataset.state = state;
  sheet.style.transform = isMobile() ? `translateY(${sheetOffsets()[state]}px)` : "";
}
(function sheetDrag() {
  let startY = null, startOff = 0, moved = false;
  sheetHead.addEventListener("pointerdown", e => {
    if (!isMobile()) return;
    startY = e.clientY; startOff = sheetOffsets()[sheet.dataset.state]; moved = false;
    sheet.classList.add("dragging");
  });
  window.addEventListener("pointermove", e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 6) moved = true;
    if (moved) sheet.style.transform = `translateY(${Math.max(0, startOff + dy)}px)`;
  });
  window.addEventListener("pointerup", e => {
    if (startY === null) return;
    sheet.classList.remove("dragging");
    const dy = e.clientY - startY;
    startY = null;
    if (!moved) return;   // a tap: let the button underneath handle it
    const o = sheetOffsets(), y = startOff + dy;
    const order = ["full", "half", "peek"];
    const nearest = order.reduce((a, b) => Math.abs(o[a] - y) < Math.abs(o[b] - y) ? a : b);
    // A quick flick moves one step in that direction even if it didn't travel far.
    const cur = order.indexOf(sheet.dataset.state);
    const next = Math.abs(dy) > 40 && nearest === sheet.dataset.state ? order[Math.min(2, Math.max(0, cur + (dy > 0 ? 1 : -1)))] : nearest;
    setSheet(next);
  });
  sheetHead.addEventListener("click", e => {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; return; }
    if (e.target.closest("button")) return;
    setSheet(sheet.dataset.state === "peek" ? "half" : "peek");
  }, true);
  window.addEventListener("resize", () => setSheet(sheet.dataset.state));
})();

// Tapping something on the map on a phone: get the sheet out of the way so its popup shows.
function lowerSheet() { if (isMobile() && sheet.dataset.state !== "peek") setSheet("peek"); }

// Fly so the target sits in the middle of the part of the map the sheet doesn't cover.
function flyVisible(latlng, zoom) {
  const cover = sheetCover();
  const p = map.project(latlng, zoom).add([0, cover / 2]);
  map.flyTo(map.unproject(p, zoom), zoom, { duration: 0.8 });
}
function fitVisible(points, maxZoom = 17) {
  const bar = document.getElementById("routebar");
  const top = bar.hidden || !isMobile() ? 20 : bar.offsetHeight + 24;
  map.fitBounds(points, { paddingTopLeft: [30, top], paddingBottomRight: [30, sheetCover() + 24], maxZoom });
}

/* ---------- Map ---------- */
fetch("data/paris-map.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(() => {
    document.getElementById("sightList").innerHTML = '<p class="empty">Couldn\'t load the map data. Try refreshing the page.</p>';
  });

function init(data) {
  D = data;
  const home = D.home;
  document.getElementById("attrib").textContent = D.attribution + " Satellite imagery © Esri. Metro lines are drawn station to station, so they're approximate.";

  map = L.map("map", { zoomControl: !isMobile(), maxZoom: 20, attributionControl: true }).setView([home.lat, home.lon], 14);
  // Road and place labels only at overview zooms; up close the photo speaks for itself.
  const satellite = L.layerGroup([
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxNativeZoom: 19, maxZoom: 20, attribution: "Imagery © Esri, Maxar" }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
      { minZoom: 12, maxZoom: 16, opacity: 0.5 }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 15 }),
  ]).addTo(map);
  const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxNativeZoom: 19, maxZoom: 20, attribution: "© OpenStreetMap contributors" });

  const Buttons = L.Control.extend({
    options: { position: "topright" },
    onAdd() {
      const box = L.DomUtil.create("div", "map-btns");
      const layer = L.DomUtil.create("button", "map-btn", box);
      layer.type = "button";
      const label = () => {
        const sat = map.hasLayer(satellite);
        layer.textContent = sat ? "🗺️" : "🛰️";
        layer.title = sat ? "Street map" : "Satellite";
        layer.setAttribute("aria-label", layer.title);
      };
      label();
      L.DomEvent.on(layer, "click", e => {
        L.DomEvent.stop(e);
        if (map.hasLayer(satellite)) { map.removeLayer(satellite); streets.addTo(map); }
        else { map.removeLayer(streets); satellite.addTo(map); }
        label();
      });
      const all = L.DomUtil.create("button", "map-btn", box);
      all.type = "button"; all.textContent = "🔭"; all.title = "Show all sights"; all.setAttribute("aria-label", all.title);
      L.DomEvent.on(all, "click", e => { L.DomEvent.stop(e); clearRoute(); showView("sights"); fitSights(); });
      L.DomEvent.disableClickPropagation(box);
      return box;
    },
  });
  map.addControl(new Buttons());

  L.circle([home.lat, home.lon], { radius: D.radius, color: "#ff6a2b", weight: 2.5, dashArray: "5 7", fillColor: "#ff6a2b", fillOpacity: 0.07, interactive: false }).addTo(map);
  homeMarker = L.marker([home.lat, home.lon], {
    icon: L.divIcon({ className: "home-icon", html: `
      <div class="home-mk">
        <span class="home-pulse"></span><span class="home-pulse two"></span>
        <span class="home-pin">🏠</span>
        <span class="home-label">Our Airbnb<small>tap for nearby</small></span>
      </div>`, iconSize: [60, 60], iconAnchor: [30, 30] }),
    zIndexOffset: 2000, title: "Our Airbnb · 130 Rue de Turenne", keyboard: true,
  }).addTo(map).on("click", goNearby);

  routeLayer = L.layerGroup().addTo(map);
  sightLayer = L.layerGroup().addTo(map);
  D.sights.forEach(s => {
    s._marker = L.marker([s.lat, s.lon], {
      icon: L.divIcon({ className: "", html: `<div class="pin pin-sight">${s.icon}</div>`, iconSize: [36, 44], iconAnchor: [18, 44], popupAnchor: [0, -40] }),
      title: s.name, riseOnHover: true, zIndexOffset: 500,
    }).addTo(sightLayer).bindPopup(() => sightPopup(s), { maxWidth: 280, autoPanPaddingTopLeft: [20, 70], autoPanPaddingBottomRight: [20, 180] })
      .on("click", lowerSheet);
  });

  Object.keys(GROUPS).forEach(g => { placeLayers[g] = L.layerGroup(); if (GROUPS[g].on) placeLayers[g].addTo(map); });
  D.places.forEach((p, i) => {
    const mk = L.marker([p.lat, p.lon], {
      icon: L.divIcon({ className: "", html: `<div class="dot dot-${p.g}">${GROUPS[p.g].icon}</div>`, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -11] }),
      title: p.name, riseOnHover: true,
    }).on("click", () => openPlace(p));
    mk.addTo(placeLayers[p.g]);
    p._marker = mk; p._i = i;
  });
  const syncZoomClass = () => {
    const z = map.getZoom();
    app.classList.toggle("far", z < PLACES_MIN_ZOOM);
    app.classList.toggle("close", z >= PLACES_MIN_ZOOM);
  };
  map.on("zoomend", syncZoomClass);

  // Leaflet keeps popup clicks from bubbling, so wire popup route buttons when they open.
  map.on("popupopen", e => {
    e.popup.getElement().querySelectorAll("[data-route]").forEach(b =>
      b.addEventListener("click", () => { map.closePopup(); select(b.dataset.id, b.dataset.route, true); }));
  });
  // Route bar buttons.
  document.getElementById("routebar").addEventListener("click", e => {
    const r = e.target.closest("[data-route]");
    if (r) { select(r.dataset.id, r.dataset.route, true); return; }
    const st = e.target.closest("[data-steps]");
    if (st) { showView("sights"); setSheet("half"); scrollToCard(selected); return; }
    if (e.target.closest("[data-clear]")) { clearRoute(); fitSights(); }
  });

  renderSights();
  renderChips();
  renderPlaces();

  document.querySelectorAll(".mtabs button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.view === "nearby") goNearby(); else { showView("sights"); if (sheet.dataset.state === "peek") setSheet("half"); }
  }));
  document.getElementById("homeRow").addEventListener("click", goNearby);
  document.getElementById("placeSearch").addEventListener("input", renderPlaces);

  setSheet("peek");
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("view") === "nearby") goNearby();
  else if (h.get("place") && D.places[+h.get("place")]) openPlace(D.places[+h.get("place")], true);
  else if (h.get("sight") && D.sights.some(s => s.id === h.get("sight"))) select(h.get("sight"), h.get("mode"), true);
  else fitSights();
  syncZoomClass();
}

function fitSights() {
  fitVisible(D.sights.map(s => [s.lat, s.lon]).concat([[D.home.lat, D.home.lon]]), 15);
}

function setHash() {
  const p = new URLSearchParams();
  if (view === "nearby") p.set("view", "nearby");
  else if (view === "place" && placeSel) p.set("place", placeSel._i);
  else if (selected) { p.set("sight", selected); if (mode) p.set("mode", mode); }
  history.replaceState(null, "", p.toString() ? "#" + p.toString() : location.pathname);
}

function showView(v) {
  view = v;
  if (v !== "place") unhighlightPlace();
  const tab = v === "place" ? "nearby" : v;
  document.querySelectorAll(".mtabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === tab));
  document.getElementById("view-sights").hidden = v !== "sights";
  document.getElementById("view-nearby").hidden = v !== "nearby";
  document.getElementById("view-place").hidden = v !== "place";
  document.getElementById("placeHead").hidden = v !== "place";
  sheet.classList.toggle("placing", v === "place");
  setSheet(sheet.dataset.state);
  document.getElementById("sheetBody").scrollTop = 0;
  setHash();
}

// Tapping the Airbnb: zoom in on the block and list what's around it.
function goNearby() {
  clearRoute();
  showView("nearby");
  setSheet(isMobile() ? "half" : sheet.dataset.state);
  flyVisible([D.home.lat, D.home.lon], NEARBY_ZOOM);
}

/* ---------- Sights ---------- */
function groupOf(s) {
  if (s.walk.m <= 1100) return 0;
  if (s.walk.m <= 2700) return 1;
  return 2;
}
const GROUP_TITLES = ["Around the corner", "Walkable · 15–35 min", "Take the metro"];

function renderSights() {
  const box = document.getElementById("sightList");
  const byGroup = [[], [], []];
  D.sights.forEach(s => byGroup[groupOf(s)].push(s));
  byGroup.forEach(g => g.sort((a, b) => a.walk.m - b.walk.m));
  box.innerHTML = byGroup.map((list, gi) => `
    <h2 class="sgroup">${GROUP_TITLES[gi]}</h2>
    ${list.map(sightCard).join("")}`).join("");
  box.addEventListener("click", e => {
    const head = e.target.closest("[data-select]");
    const modeBtn = e.target.closest("[data-mode]");
    if (modeBtn) { select(modeBtn.closest(".scard").dataset.id, modeBtn.dataset.mode, true, true); return; }
    if (head) {
      const id = head.closest(".scard").dataset.id;
      if (selected === id) { clearRoute(); fitSights(); }
      else select(id, null, true);
    }
  });
}

function sightCard(s) {
  const w = `🚶 ${walkMin(s.walk.m)} min · ${km(s.walk.m)}`;
  const m = s.metro ? ` <span class="sep">·</span> 🚇 ${metroMinutes(s.metro)} min ${s.metro.rides.map(r => lineBadge(r.line, D.lines[r.line])).join("")}` : "";
  return `
  <article class="scard" data-id="${s.id}">
    <button type="button" class="shead" data-select aria-expanded="false">
      <span class="sicon" aria-hidden="true">${s.icon}</span>
      <span class="stext"><span class="sname">${esc(s.name)}</span><span class="smeta">${w}${m}</span></span>
      ${s.day ? `<span class="sday">${esc(s.day)}</span>` : ""}
    </button>
    <div class="sbody" hidden></div>
  </article>`;
}

function sightPopup(s) {
  const metro = s.metro ? `<div class="spop-t">🚇 <b>${metroMinutes(s.metro)} min</b> by metro ${s.metro.rides.map(r => lineBadge(r.line, D.lines[r.line])).join("")}</div>` : "";
  return `<div class="spop">
    <div class="spop-h"><span>${s.icon}</span><b>${esc(s.name)}</b></div>
    <div class="spop-t">🚶 <b>${walkMin(s.walk.m)} min</b> walk from the Airbnb · ${km(s.walk.m)}</div>
    ${metro}
    ${s.day ? `<div class="spop-day">On the plan: ${esc(s.day)}</div>` : ""}
    <div class="spop-b">
      <button type="button" data-route="walk" data-id="${s.id}">🚶 Walking route</button>
      ${s.metro ? `<button type="button" data-route="metro" data-id="${s.id}">🚇 Metro route</button>` : ""}
    </div>
  </div>`;
}

function defaultMode(s) { return s.metro && s.walk.m > 2700 ? "metro" : "walk"; }

function select(id, m, moveMap, fromSheet) {
  const s = D.sights.find(x => x.id === id);
  selected = id;
  mode = m && (m === "walk" || s.metro) ? m : defaultMode(s);
  if (view !== "sights") showView("sights");
  refreshCards();
  renderRouteBar();
  // On phones, drop the sheet so the route is visible; the route bar keeps the summary.
  if (isMobile() && !fromSheet) setSheet("peek");
  drawRoute(moveMap);
  setHash();
}

function clearRoute() {
  selected = null; mode = null;
  routeLayer.clearLayers();
  refreshCards();
  renderRouteBar();
  setHash();
}

function scrollToCard(id) {
  const card = document.querySelector(`.scard[data-id="${id}"]`);
  if (!card) return;
  const body = document.getElementById("sheetBody");
  if (isMobile()) body.scrollTo({ top: card.offsetTop - 8, behavior: "smooth" });
  else card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function refreshCards() {
  document.querySelectorAll(".scard").forEach(card => {
    const on = card.dataset.id === selected;
    card.classList.toggle("on", on);
    card.querySelector(".shead").setAttribute("aria-expanded", on);
    const body = card.querySelector(".sbody");
    body.hidden = !on;
    body.innerHTML = on ? sightBody(D.sights.find(x => x.id === selected)) : "";
  });
}

function renderRouteBar() {
  const bar = document.getElementById("routebar");
  const s = D && D.sights.find(x => x.id === selected);
  app.classList.toggle("has-route", !!s);
  if (!s) { bar.hidden = true; bar.innerHTML = ""; return; }
  const metroMode = mode === "metro" && s.metro;
  const summary = metroMode
    ? `🚇 ${metroMinutes(s.metro)} min · ${s.metro.rides.map(r => lineBadge(r.line, D.lines[r.line])).join("")} from ${esc(s.metro.rides[0].stops[0].name)}`
    : `🚶 ${walkMin(s.walk.m)} min walk · ${km(s.walk.m)}`;
  bar.innerHTML = `
    <div class="rb-main">
      <span class="rb-icon" aria-hidden="true">${s.icon}</span>
      <span class="rb-text"><b>${esc(s.name)}</b><span class="rb-sub">${summary}</span></span>
      <button type="button" class="rb-x" data-clear aria-label="Close route">✕</button>
    </div>
    <div class="rb-actions">
      ${s.metro ? `
        <button type="button" data-route="walk" data-id="${s.id}" aria-pressed="${!metroMode}">🚶 ${walkMin(s.walk.m)} min</button>
        <button type="button" data-route="metro" data-id="${s.id}" aria-pressed="${!!metroMode}">🚇 ${metroMinutes(s.metro)} min</button>` : ""}
      <button type="button" data-steps>Steps</button>
    </div>`;
  bar.hidden = false;
  app.style.setProperty("--rb-h", bar.offsetHeight + "px");
}

function sightBody(s) {
  const home = D.home;
  const toggle = s.metro ? `
    <div class="modes" role="group" aria-label="Route type">
      <button type="button" data-mode="walk" aria-pressed="${mode === "walk"}">🚶 Walk ${walkMin(s.walk.m)} min</button>
      <button type="button" data-mode="metro" aria-pressed="${mode === "metro"}">🚇 Metro ${metroMinutes(s.metro)} min</button>
    </div>` : "";
  let steps;
  if (mode === "metro" && s.metro) {
    const mt = s.metro;
    const first = mt.rides[0].stops[0].name, last = mt.rides[mt.rides.length - 1].stops.slice(-1)[0].name;
    steps = `<ol class="steps">
      <li><span class="sic">🚶</span><span>Walk ${walkMin(mt.walkTo.m)} min (${km(mt.walkTo.m)}) to <b>${esc(first)}</b></span></li>
      ${mt.rides.map((r, i) => `
      <li><span class="sic">${lineBadge(r.line, D.lines[r.line])}</span><span>${i ? "Change to" : "Take"} <b>line ${esc(r.line)}</b> toward ${esc(r.dir)}. Ride ${r.stops.length - 1} stop${r.stops.length === 2 ? "" : "s"} to <b>${esc(r.stops.slice(-1)[0].name)}</b>
        <details class="stops"><summary>Show stops</summary>${r.stops.map(x => esc(x.name)).join(" → ")}</details></span></li>`).join("")}
      <li><span class="sic">🚶</span><span>Walk ${walkMin(mt.walkFrom.m)} min (${km(mt.walkFrom.m)}) from ${esc(last)} to ${esc(s.name)}</span></li>
    </ol>
    <p class="snote">One metro ticket (€2.55) per person covers the whole trip, changes included.</p>`;
  } else {
    steps = `<ol class="steps">
      <li><span class="sic">🚶</span><span>Walk ${walkMin(s.walk.m)} min (${km(s.walk.m)})${s.walk.via.length ? ` via ${s.walk.via.map(esc).join(", ")}` : ""}</span></li>
    </ol>`;
  }
  return `
    <p>${esc(s.blurb)}</p>
    ${toggle}
    ${steps}
    <p class="slinks">Live directions:
      <a href="${gmaps(s.lat, s.lon, "walking", home)}" target="_blank" rel="noopener noreferrer">walking ↗</a>
      ${s.metro ? `· <a href="${gmaps(s.lat, s.lon, "transit", home)}" target="_blank" rel="noopener noreferrer">transit ↗</a>` : ""}
    </p>`;
}

function casedLine(latlngs, color, opts = {}) {
  return [
    L.polyline(latlngs, { color: "#ffffff", weight: (opts.weight || 5) + 4, opacity: 0.85, lineCap: "round", lineJoin: "round", interactive: false }),
    L.polyline(latlngs, { color, weight: opts.weight || 5, opacity: 1, dashArray: opts.dash, lineCap: "round", lineJoin: "round", interactive: false }),
  ];
}

function drawRoute(moveMap = true) {
  routeLayer.clearLayers();
  const s = D.sights.find(x => x.id === selected);
  if (!s) return;
  const WALK = "#2f6fed";
  let bounds = [];
  if (mode === "metro" && s.metro) {
    const mt = s.metro;
    casedLine(mt.walkTo.path, WALK, { dash: "1 9", weight: 5 }).forEach(l => l.addTo(routeLayer));
    casedLine(mt.walkFrom.path, WALK, { dash: "1 9", weight: 5 }).forEach(l => l.addTo(routeLayer));
    mt.rides.forEach((r, ri) => {
      const pts = r.stops.map(x => [x.lat, x.lon]);
      const color = D.lines[r.line];
      L.polyline(pts, { color: "#1b1b1b", weight: 10, opacity: 0.55, interactive: false }).addTo(routeLayer);
      L.polyline(pts, { color, weight: 6, opacity: 1, interactive: false }).addTo(routeLayer);
      r.stops.forEach((x, i) => {
        const end = i === 0 || i === r.stops.length - 1;
        L.circleMarker([x.lat, x.lon], { radius: end ? 7 : 4, color, weight: 3, fillColor: "#fff", fillOpacity: 1 })
          .bindTooltip(esc(x.name), { direction: "top", offset: [0, -6], permanent: (ri === 0 && i === 0) || i === r.stops.length - 1, className: "stip" })
          .addTo(routeLayer);
      });
      bounds = bounds.concat(pts);
    });
    bounds = bounds.concat(mt.walkTo.path, mt.walkFrom.path);
  } else {
    casedLine(s.walk.path, WALK, { weight: 6 }).forEach(l => l.addTo(routeLayer));
    bounds = s.walk.path;
    // Walking time label at the route's midpoint.
    const mid = s.walk.path[Math.floor(s.walk.path.length / 2)];
    L.marker(mid, { icon: L.divIcon({ className: "", html: `<span class="walk-tag">🚶 ${walkMin(s.walk.m)} min</span>`, iconSize: [80, 26], iconAnchor: [40, 13] }), interactive: false }).addTo(routeLayer);
  }
  L.marker([s.lat, s.lon], {
    icon: L.divIcon({ className: "", html: `<div class="pin pin-sight pin-target">${s.icon}</div>`, iconSize: [44, 52], iconAnchor: [22, 52] }),
    zIndexOffset: 900, interactive: false,
  }).addTo(routeLayer);
  if (moveMap) fitVisible(bounds, 17);
}

/* ---------- Nearby ---------- */
const DAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
// Our Paris days, Wed 2 – Mon 7 Dec, as weekday indexes (Mon = 0).
const STAY = [{ d: 2, i: 2 }, { d: 3, i: 3 }, { d: 4, i: 4 }, { d: 5, i: 5 }, { d: 6, i: 6 }, { d: 7, i: 0 }];

// Parses the common OpenStreetMap opening_hours forms ("Mo-Fr 08:00-19:00; Sa 09:00-13:00,14:00-18:00; Su off").
// Returns 7 lists of [startMin, endMin], or null if the string uses anything fancier.
function parseHours(str) {
  if (!str) return null;
  const s = str.trim();
  const week = Array.from({ length: 7 }, () => []);
  if (s === "24/7") return week.map(() => [[0, 1440]]);
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  // A comma after a time that's followed by a day starts a new rule ("Mo-Sa 08:30-16:00, Su closed").
  const rules = s.replace(/(\d|off|closed)\s*,\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su)\b)/g, "$1; ").split(";").map(r => r.trim()).filter(Boolean);
  for (let rule of rules) {
    if (/^(PH|SH)\b(?!\s*,\s*(Mo|Tu|We|Th|Fr|Sa|Su))/.test(rule)) continue;   // public/school holiday rules don't apply to our dates
    rule = rule.replace(/\b(PH|SH)\b\s*,?\s*|,\s*\b(PH|SH)\b/g, "").trim();
    if (!rule) continue;
    const m = rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)+)?\s*(.*)$/);
    if (!m) return null;
    let days = [0, 1, 2, 3, 4, 5, 6];
    if (m[1]) {
      days = [];
      for (const part of m[1].split(",").map(x => x.trim()).filter(Boolean)) {
        const [a, b] = part.split("-").map(x => DAYS.indexOf(x.trim()));
        if (a < 0 || (b !== undefined && b < 0)) return null;
        if (b === undefined) days.push(a);
        else for (let d = a; ; d = (d + 1) % 7) { days.push(d); if (d === b) break; }
      }
    }
    const times = m[2].trim();
    let ranges = [];
    if (!/^(off|closed)$/i.test(times)) {
      for (const t of times.split(",").map(x => x.trim())) {
        const r = t.match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/);
        if (!r) return null;
        ranges.push([toMin(r[1]), toMin(r[2])]);
      }
    }
    days.forEach(d => week[d] = ranges);
  }
  return week;
}
const fmtMin = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const fmtDay = rs => rs.length ? rs.map(([a, b]) => a === 0 && b === 1440 ? "24 hours" : `${fmtMin(a)}–${fmtMin(b)}`).join(", ") : "Closed";

function parisNow() {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Paris", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).reduce((o, x) => (o[x.type] = x.value, o), {});
  return { day: DAY_NAMES.indexOf(parts.weekday), min: +parts.hour * 60 + +parts.minute };
}
// "open" | "closed", with when it next changes. Handles ranges that run past midnight.
function openStatus(week) {
  const { day, min } = parisNow();
  const yest = (day + 6) % 7;
  for (const [a, b] of week[yest]) if (b < a && min < b) return { open: true, until: b };
  for (const [a, b] of week[day]) {
    const end = b < a ? b + 1440 : b;
    if (min >= a && min < end) return { open: true, until: end % 1440 };
  }
  for (let k = 0; k < 7; k++) {
    const d = (day + k) % 7;
    const next = week[d].map(r => r[0]).filter(a => k > 0 || a > min).sort((x, y) => x - y)[0];
    if (next !== undefined) return { open: false, next, day: k === 0 ? "today" : k === 1 ? "tomorrow" : DAY_NAMES[d] };
  }
  return { open: false };
}

const COMPASS = ["north", "north-east", "east", "south-east", "south", "south-west", "west", "north-west"];
function direction(p) {
  const h = D.home, y = p.lat - h.lat, x = (p.lon - h.lon) * Math.cos(h.lat * Math.PI / 180);
  const deg = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
  return COMPASS[Math.round(deg / 45) % 8];
}

function statusBadge(p) {
  const week = parseHours(p.hours);
  if (!week) return "";
  const st = openStatus(week);
  return st.open ? '<span class="open-dot on">Open now</span>' : '<span class="open-dot">Closed now</span>';
}

function placeDetail(p) {
  const home = D.home;
  const q = encodeURIComponent(`${p.name}, ${p.addr ? p.addr + ", " : ""}${p.pc || ""} Paris`);
  const mins = walkMin(p.m * 1.25);
  const week = parseHours(p.hours);
  let hours;
  if (week) {
    const st = openStatus(week);
    const now = st.open
      ? `<span class="pd-status on">Open now</span> until ${fmtMin(st.until)}`
      : `<span class="pd-status">Closed now</span>${st.next !== undefined ? ` · opens ${st.day} at ${fmtMin(st.next)}` : ""}`;
    const today = parisNow().day;
    const closedStay = STAY.filter(x => !week[x.i].length).map(x => `${DAY_NAMES[x.i]} ${x.d}`);
    hours = `
      <div class="pd-row"><span class="pd-ic">🕒</span><div>${now} <span class="muted">(Paris time)</span>
        <table class="pd-hours">${DAY_NAMES.map((n, i) => `<tr class="${i === today ? "today" : ""}"><th>${n}</th><td>${fmtDay(week[i])}</td></tr>`).join("")}</table>
        ${closedStay.length ? `<div class="pd-warn">⚠️ Closed on our Paris day${closedStay.length > 1 ? "s" : ""}: ${closedStay.join(", ")} Dec</div>`
          : `<div class="pd-ok">✓ Open every day we're in Paris (Dec 2–7)</div>`}</div></div>`;
  } else if (p.hours) {
    hours = `<div class="pd-row"><span class="pd-ic">🕒</span><div>${esc(p.hours)}</div></div>`;
  } else {
    hours = `<div class="pd-row"><span class="pd-ic">🕒</span><div class="muted">Hours aren't listed. Check “Reviews &amp; photos” before going.</div></div>`;
  }
  const kind = [p.label, p.cuisine && p.cuisine.toLowerCase() !== p.label.toLowerCase() ? p.cuisine : null].filter(Boolean).join(" · ");
  const actions = [
    `<a class="pd-act primary" href="${gmaps(p.lat, p.lon, "walking", home)}" target="_blank" rel="noopener noreferrer">🚶<span>Walk ${mins} min</span></a>`,
    p.phone ? `<a class="pd-act" href="tel:${esc(p.phone.replace(/\s/g, ""))}">📞<span>Call</span></a>` : "",
    p.web ? `<a class="pd-act" href="${esc(p.web)}" target="_blank" rel="noopener noreferrer">🌐<span>Website</span></a>` : "",
    p.menu ? `<a class="pd-act" href="${esc(p.menu)}" target="_blank" rel="noopener noreferrer">📋<span>Menu</span></a>` : "",
    p.insta ? `<a class="pd-act" href="${esc(p.insta)}" target="_blank" rel="noopener noreferrer">📷<span>Instagram</span></a>` : "",
    `<a class="pd-act" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener noreferrer">⭐<span>Reviews &amp; photos</span></a>`,
    `<a class="pd-act" href="https://maps.apple.com/?q=${encodeURIComponent(p.name)}&ll=${p.lat},${p.lon}" target="_blank" rel="noopener noreferrer">🍎<span>Apple Maps</span></a>`,
  ].join("");
  const head = `
    <button type="button" class="pd-back" data-back aria-label="Back to nearby">←</button>
    <span class="dot dot-${p.g} pd-dot" aria-hidden="true">${GROUPS[p.g].icon}</span>
    <div class="pd-title"><h2>${esc(p.name)}</h2><div class="muted">${statusBadge(p)}${esc(kind)}${p.chain ? ` · part of ${esc(p.chain)}` : ""}</div></div>`;
  return { head, body: `
    ${p.desc ? `<p class="pd-desc">${esc(p.desc)}</p>` : ""}
    <div class="pd-acts">${actions}</div>
    <div class="pd-row"><span class="pd-ic">📍</span><div>${p.addr ? `<b>${esc(p.addr)}</b>${p.pc ? `, ${esc(p.pc)} Paris` : ""}<br>` : ""}
      ${mins} min walk (${km(p.m)}) ${direction(p)} of the Airbnb${p.level ? ` · floor ${esc(p.level)}` : ""}</div></div>
    ${hours}
    ${p.phone ? `<div class="pd-row"><span class="pd-ic">📞</span><div><a href="tel:${esc(p.phone.replace(/\s/g, ""))}">${esc(p.phone)}</a></div></div>` : ""}
    ${p.f && p.f.length ? `<div class="pd-row"><span class="pd-ic">✨</span><div class="pd-feats">${p.f.map(x => `<span>${esc(x)}</span>`).join("")}</div></div>` : ""}
    <p class="pd-src">From OpenStreetMap${p.check ? `, last checked ${esc(p.check)}` : ""}. December hours can change around the holidays, so confirm before a special trip.</p>` };
}

let placeHi = null;
function unhighlightPlace() {
  if (placeHi) { placeHi._icon && placeHi._icon.querySelector(".dot")?.classList.remove("dot-on"); placeHi.setZIndexOffset(0); placeHi = null; }
  placeSel = null;
}
function openPlace(p, fromHash) {
  unhighlightPlace();
  clearRoute();
  showView("place");
  placeSel = p;
  const det = placeDetail(p);
  document.getElementById("view-place").innerHTML = det.body;
  const ph = document.getElementById("placeHead");
  ph.innerHTML = det.head;
  ph.querySelector("[data-back]").addEventListener("click", () => { showView("nearby"); routeLayer.clearLayers(); });
  setSheet(sheet.dataset.state);
  if (!GROUPS[p.g].on) document.querySelector(`.chip[data-g="${p.g}"]`)?.click();
  placeHi = p._marker;
  placeHi.setZIndexOffset(1500);
  // The marker's element only exists once it's on the map; restyle it after the move if needed.
  const mark = () => placeHi && placeHi === p._marker && placeHi._icon && placeHi._icon.querySelector(".dot").classList.add("dot-on");
  mark();
  L.polyline([[D.home.lat, D.home.lon], [p.lat, p.lon]], { color: "#ff6a2b", weight: 3, dashArray: "2 8", lineCap: "round", interactive: false }).addTo(routeLayer);
  if (isMobile()) setSheet("half");
  flyVisible([p.lat, p.lon], Math.max(fromHash ? 18 : map.getZoom(), 17));
  map.once("moveend", mark);
  setHash();
}

function renderChips() {
  const counts = {};
  D.places.forEach(p => counts[p.g] = (counts[p.g] || 0) + 1);
  const box = document.getElementById("chips");
  box.innerHTML = Object.entries(GROUPS).filter(([g]) => counts[g]).map(([g, v]) =>
    `<button type="button" class="chip" data-g="${g}" aria-pressed="${v.on}">${v.icon} ${v.label} <span>${counts[g]}</span></button>`).join("");
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-g]");
    if (!b) return;
    const g = b.dataset.g;
    GROUPS[g].on = !GROUPS[g].on;
    b.setAttribute("aria-pressed", GROUPS[g].on);
    if (GROUPS[g].on) placeLayers[g].addTo(map); else map.removeLayer(placeLayers[g]);
    renderPlaces();
  });
}

function renderPlaces() {
  const q = document.getElementById("placeSearch").value.trim().toLowerCase();
  const list = D.places.filter(p => GROUPS[p.g].on && (!q || (p.name + " " + p.label + " " + (p.cuisine || "")).toLowerCase().includes(q)));
  document.getElementById("placeCount").textContent = `${list.length} place${list.length === 1 ? "" : "s"} within ${D.radius} m (about 2 blocks), closest first`;
  document.getElementById("placeList").innerHTML = list.map(p => `
    <li><button type="button" class="pitem" data-i="${p._i}">
      <span class="dot dot-${p.g}" aria-hidden="true">${GROUPS[p.g].icon}</span>
      <span class="ptext"><span class="pname">${esc(p.name)}</span>
        <span class="pmeta">${statusBadge(p)}${esc(p.label)}${p.cuisine ? " · " + esc(p.cuisine) : ""}${p.addr ? " · " + esc(p.addr) : ""}</span></span>
      <span class="pdist">${walkMin(p.m * 1.25)} min</span>
    </button></li>`).join("") || '<li class="empty">Nothing matches. Try turning on more categories.</li>';
}

document.getElementById("placeList").addEventListener("click", e => {
  const b = e.target.closest("[data-i]");
  if (!b) return;
  openPlace(D.places[+b.dataset.i]);
});
</script>
<script src="theme.js"></script>
</body>
</html>
